{{ define "content" }}
  <div class="container-page pt-24 pb-24 flex flex-col items-center text-center">
    <p class="font-mono text-[64px] leading-none text-fg-3/25">{{ .Status }}</p>
    <h1 class="mt-6 text-[28px] md:text-[32px]">{{ .Title }}</h1>
    <p class="mt-3 text-[15px] text-fg-3 max-w-[46ch]">{{ .Message }}</p>
    <div class="mt-7 flex flex-wrap justify-center gap-2.5">
      <a href="/" class="btn btn-primary">Go home</a>
      <a href="/skills" class="btn">Browse skills</a>
    </div>
  </div>
{{ end }}
