{{ define "content" }}
  <div class="min-h-[70vh] flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-[340px]">
      <div class="flex items-center gap-3 mb-8">
        {{/* The mark, at the one size it is allowed to carry the accent: the
             sign-in page has no primary action to compete with it. */}}
        <span
          class="flex items-center justify-center w-[34px] h-[34px] rounded-[9px] bg-surface-2 border border-line shrink-0"
          aria-hidden="true"
        >
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
            <g stroke="currentColor" stroke-width="3.3" class="text-fg">
              <path d="M19.99 13.84A8.2 8.2 0 0 1 13.84 19.99" />
              <path d="M10.16 19.99A8.2 8.2 0 0 1 4.01 13.84" />
              <path d="M4.01 10.16A8.2 8.2 0 0 1 10.16 4.01" />
              <path d="M13.84 4.01A8.2 8.2 0 0 1 19.99 10.16" />
            </g>
            <rect x="9.5" y="9.5" width="5" height="5" fill="#FAD657" transform="rotate(45 12 12)" />
          </svg>
        </span>
        <span class="min-w-0">
          <span class="block text-[15px] font-medium text-fg leading-tight">Circe</span>
          <span class="block text-[13px] text-fg-3 leading-tight">Private registry</span>
        </span>
      </div>

      <form method="post" action="/login" class="flex flex-col gap-3">
        <input type="hidden" name="next" value="{{ .Next }}" />

        <div>
          <label class="label" for="passcode">Passcode</label>
          <div class="relative">
            <svg
              class="absolute left-3 top-1/2 -translate-y-1/2 text-fg-4 pointer-events-none"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <circle cx="8" cy="15" r="4" />
              <path d="M10.85 12.15 19 4M18 5l2 2M15 8l2 2" />
            </svg>
            <input
              id="passcode"
              name="passcode"
              type="password"
              required
              autofocus
              autocomplete="current-password"
              placeholder="Enter passcode"
              class="field pl-9 h-10"
              aria-describedby="{{ if .Error }}passcode-error{{ end }}"
            />
          </div>
        </div>

        {{ with .Error }}
          <div id="passcode-error" class="flash flash-error flash-tight" role="alert">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="flash-icon"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9" /><path d="M12 7.5v5.5M12 16.5v.5" />
            </svg>
            <span class="sr-only">Error: </span>
            <span class="min-w-0 break-words">{{ . }}</span>
          </div>
        {{ end }}

        <button type="submit" class="btn btn-primary h-10 w-full mt-1">Continue</button>
      </form>
    </div>
  </div>
{{ end }}
