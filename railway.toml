[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# One instance, and this one is a correctness constraint rather than a sizing
# choice: the registry is a single-writer SQLite database on a local volume, so
# a second replica would neither see the same data nor be safe to write it.
numReplicas = 1
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
# The health endpoint is exempt from auth so the platform can probe it.
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
